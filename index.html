// Live location: runs while a shift is open. A web app cannot read the GPS with the screen off, so the app keeps the screen awake,
// saves a route point every 5 minutes, and tells supervisors when the app went to the background.
let consent=null,trk=null,gid=null,iv2=null,openId=null,lastSent=0,lastTrail=0,wl=null,lastPos=null,trail=[],inbox=[],nu=null,seen=null,tt=null;
const wake=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
const mkpt=p=>({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy),ts:Date.now()});
function pushLive(pt,force){if(!openId)return;lastPos=pt;if(!force&&Date.now()-lastSent<30000)return;lastSent=Date.now();const patch={live:pt};
 if(Date.now()-lastTrail>3e5){lastTrail=Date.now();trail=[...trail,{lat:pt.lat,lng:pt.lng,ts:pt.ts}].slice(-300);patch.trail=trail}
 DB.upd('shifts',openId,patch,1)}
const poll=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>pushLive(mkpt(p),true),()=>{},{enableHighAccuracy:true,timeout:15000});
document.addEventListener('visibilitychange',()=>{if(!openId)return;
 if(document.visibilityState=='visible'){wake();poll()}
 else if(lastPos)DB.upd('shifts',openId,{live:{...lastPos,bg:Date.now()}},1)});
function startTrack(){stopTrack();startNotif();DB.list('consents',['uid','==',U.id]).then(r=>{consent=r.some(x=>x.version>=CONSENT_V);if(!consent)render()},()=>{});trk=DB.watch('shifts',r=>{const o=r.find(x=>!x.t1);openId=o?o.id:null;
 if(o&&gid==null&&navigator.geolocation){trail=o.trail||[];lastPos=o.live||null;wake();
  gid=navigator.geolocation.watchPosition(p=>pushLive(mkpt(p)),()=>{},{enableHighAccuracy:true});
  iv2=setInterval(()=>{if(openId&&document.visibilityState=='visible'&&Date.now()-lastSent>60000)poll()},30000)}
 if(!o&&gid!=null){navigator.geolocation.clearWatch(gid);gid=null;clearInterval(iv2);wl&&wl.release()}},['uid','==',U.id])}
function stopTrack(){trk&&trk();trk=null;gid!=null&&navigator.geolocation.clearWatch(gid);gid=null;clearInterval(iv2);openId=null;consent=null;wl&&wl.release();stopNotif()}

// In-app inbox + toast. Phone (push) notifications are sent by the Cloud Function in SETUP.md.
const toast=m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,6000)};
const bell=()=>{const b=$('#bell');if(b)b.textContent='Inbox'+(inbox.length?' ('+inbox.length+')':'')};
function startNotif(){stopNotif();nu=DB.watch('notifs',r=>{inbox=r;
 if(seen===null){seen=new Set(r.map(x=>x.id));r.filter(x=>Date.now()-x.ts>5*864e5).forEach(x=>DB.purge('notifs',x.id))}
 else{const n=r.filter(x=>!seen.has(x.id));n.forEach(x=>seen.add(x.id));if(n.length)toast(n[0].title+': '+n[0].body)}bell()},['to','==',U.id])}
function stopNotif(){nu&&nu();nu=null;seen=null;inbox=[]}

 await Promise.all(L.map(to=>DB.add('notifs',{to,title,body,tab:tab||'',from:U.id},1).catch(()=>{})))}

  w.document.write(`<title>${i.type=='quote'?'Quote':'Invoice'} ${esc(i.no)}</title><style>body{font:13px system-ui;margin:36px;color:#111}.doc table{border-collapse:collapse;width:100%;margin:16px 0}.doc th,.doc td{border-bottom:1px solid #bbb;padding:6px;text-align:left}.doc td.n,.doc th.n{text-align:right}.doc .g{display:flex;justify-content:space-between;gap:20px}.doc .s{color:#555;white-space:pre-line}.doc h1{margin:0 0 4px;font-size:22px}.doc .t{font-size:16px}</style><div class="doc">${docBody(i,biz)}</div>`);
  w.document.close();setTimeout(()=>w.print(),300)};
 const draw=()=>{$('#l').innerHTML=inv.map(i=>{const q=i.type=='quote',s=shr[i.id];
  return`<hr><b>${esc(i.no)}</b> ${esc(i.customer.name)} <span class="tag">${q?'Quote':'Invoice'}</span> <span class="tag">${i.status}</span>${s&&s.response?` <small>customer ${s.response} ${fdt(s.respondedAt)}</small>`:''}<br><small>${i.date}, ${q?'valid until':'due'} ${i.due} | ${eur(itot(i.lines).gross)}</small>
  <div class="r" style="margin-top:6px"><button class="o sm" data-ie="${i.id}">Edit</button><button class="o sm" data-ip="${i.id}">PDF</button><button class="o sm" data-sh="${i.id}">Share link</button>
  ${i.status=='draft'?`<button class="sm" data-is="${i.id}">Mark sent</button>`:''}${!q&&i.status=='sent'?`<button class="sm" data-is="${i.id}">Mark paid</button>`:''}${q&&i.status=='sent'?`<button class="sm" data-qs="${i.id}|accepted">Accepted</button><button class="o sm" data-qs="${i.id}|declined">Declined</button>`:''}${q&&i.status=='accepted'?`<button class="sm" data-ci="${i.id}">Create invoice</button>`:''}${i.status=='draft'?`<button class="d sm" data-id="${i.id}">Delete</button>`:''}</div>`}).join('')||'<p class="m">Nothing yet.</p>';
  v.querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>{open(b.dataset.ie);scrollTo(0,0)});
  v.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>pdf(inv.find(x=>x.id==b.dataset.ip)));
  v.querySelectorAll('[data-sh]').forEach(b=>b.onclick=async()=>{const i=inv.find(x=>x.id==b.dataset.sh);try{const t=await publish(i);showLink(i,location.origin+location.pathname+'#/v/'+t)}catch(e){alert('Could not create the link: '+e.message)}});
  v.querySelectorAll('[data-is]').forEach(b=>b.onclick=()=>{const i=inv.find(x=>x.id==b.dataset.is);DB.upd('invoices',i.id,{status:i.status=='draft'?'sent':'paid'})});
  v.querySelectorAll('[data-qs]').forEach(b=>{const[id,s]=b.dataset.qs.split('|');b.onclick=()=>DB.upd('invoices',id,{status:s})});
  v.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{const i=inv.find(x=>x.id==b.dataset.ci);open('new','invoice',{customer:i.customer,lines:i.lines,note:i.note});scrollTo(0,0)});
  v.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>confirm('Remove this draft? It stays in Records and keeps its number.')&&DB.del('invoices',b.dataset.id))};
 $('#nw').onclick=()=>open('new','invoice');$('#nq').onclick=()=>open('new','quote');$('#bz').onclick=()=>{showB=!showB;bform()};$('#rf').onclick=refresh;
 DB.getD('private','biz').then(b=>{biz=b||{};if(!biz.name){showB=true}bform()});
 live('invoices',r=>{rawInv=r},undefined,true);live('invoices',r=>{inv=r;draw();if(!checked&&r.length){checked=true;refresh()}});live('customers',r=>{cu=r});
}
async function publicView(t){
 $('#nav').hidden=true;$('#who').innerHTML='';const v=$('#view');v.innerHTML='<div class="card"><p class="m">Loading...</p></div>';
 let d=null;try{d=await DB.getD('shares',t)}catch(e){}
 if(!d){v.innerHTML='<div class="card"><h2>Link not found</h2><p class="m">This link is not valid or has been removed. Ask the sender for a new one.</p></div>';return}
 const q=d.type=='quote',draw=()=>{v.innerHTML=`<div class="card doc">${docBody(d,d.biz)}</div><div class="card noprint">${q?(d.response?`<p><b>You ${d.response} this quote.</b> Thank you.</p>`:'<p>Please confirm your decision on this quote.</p><div class="r"><button id="ac">Accept quote</button><button class="d" id="dc">Decline</button></div>'):''}
  <div style="margin-top:10px"><button class="o" id="pr">Print or save as PDF</button></div><p class="e" id="er"></p></div>`;
  const ans=async r=>{if(!confirm(r=='accepted'?'Accept this quote?':'Decline this quote?'))return;try{const at=Date.now();await DB.updD('shares',t,{response:r,respondedAt:at});d.response=r;draw()}catch(e){$('#er').textContent='Could not send your answer. Please try again or contact the company.'}};
  if($('#ac')){$('#ac').onclick=()=>ans('accepted');$('#dc').onclick=()=>ans('declined')}$('#pr').onclick=()=>print()};
 draw();
}

 ${Object.keys(S.rates).map(k=>`<label>${k} (€ per m²)</label><input class="rt" data-k="${k}" type="number" step="0.1" value="${S.rates[k]}">`).join('')}
 <div class="r"><div><label>Minimum price (€)</label><input id="mn" type="number" value="${S.min}"></div><div><label>VAT %</label><input id="vt" type="number" step="0.1" value="${S.vat}"></div></div>
 <label>Quote extras (one per line: Name=price for each one)</label><textarea id="ex" rows="8">${Object.entries(S.extras).map(([k,p])=>k+'='+p).join('\n')}</textarea>
 <label>Item list for employees (one per line)</label><textarea id="ct" rows="4">${S.catalog.map(esc).join('\n')}</textarea>

 <div class="r"><div><label>Evening from (hour 0-24)</label><input id="pes" type="number" min="0" max="24" value="${P.eveS}"></div><div><label>Evening until</label><input id="pee" type="number" min="0" max="24" value="${P.eveE}"></div></div>
 <div class="r"><div><label>Night from (hour 0-24)</label><input id="pns" type="number" min="0" max="24" value="${P.nightS}"></div><div><label>Night until</label><input id="pne" type="number" min="0" max="24" value="${P.nightE}"></div></div>
 <label class="ck" style="margin-top:12px"><input type="checkbox" id="pev" ${P.eves!==false?'checked':''}>Count Christmas Eve and Midsummer Eve as public holidays (depends on your agreement)</label>
 <p class="e" id="er"></p><button id="go">Save</button></div>`;
 $('#go').onclick=async()=>{const rates={};v.querySelectorAll('.rt').forEach(x=>rates[x.dataset.k]=+x.value);

  const pay={day:+$('#pd').value||8,week:+$('#pw').value||40,eveS:+$('#pes').value,eveE:+$('#pee').value,nightS:+$('#pns').value,nightE:+$('#pne').value,eves:$('#pev').checked};
  S={...S,rates,extras,pay,min:+$('#mn').value,vat:+$('#vt').value,phone:$('#ph').value.trim(),catalog:$('#ct').value.split('\n').map(x=>x.trim()).filter(Boolean)};
  try{await DB.setS(S);$('#er').textContent='Saved.'}catch(e){$('#er').textContent=e.message}};
}
